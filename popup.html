<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --fg: #0f0f0f; --sub: #606060; --bg: #fff; --panel: #f2f2f2; --panel-h: #e5e5e5; --line: #e5e5e5; --line2: #d9d9d9;
    --accent: #5b4ee6; --ok: #1a7f37; --danger: #c62828; --danger-bg: #fdecea; --bar: #7c6cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f1f1f1; --sub: #aaa; --bg: #202124; --panel: #2d2e31; --panel-h: #3a3b3f; --line: #3a3b3f; --line2: #4a4b4f;
      --accent: #a5b4fc; --ok: #6ee7a0; --danger: #ff8a80; --danger-bg: #3b2322; --bar: #8b80f5;
    }
  }
  * { box-sizing: border-box; }
  body { width: 330px; margin: 0; padding: 16px; font: 14px/1.5 "Noto Sans JP", "Meiryo", sans-serif; color: var(--fg); background: var(--bg); user-select: none; }
  h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .status { margin: 0 0 14px; padding: 10px 12px; background: var(--panel); border-radius: 10px; }
  .status b { font-size: 17px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; padding: 6px 12px 10px; min-width: 0; }
  legend { font-weight: 700; padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; min-height: 32px; cursor: pointer; }
  .row input[type=radio], .row input[type=checkbox] { margin: 0; width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .row .label { flex: 1; }
  .hint { font-size: 12px; color: var(--sub); margin: -4px 0 4px 24px; }
  .dim { opacity: 0.4; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; flex: none; }
  .stepper button { width: 32px; height: 30px; border: none; background: var(--panel); font: 600 18px/1 sans-serif; color: var(--fg); cursor: pointer; padding: 0; }
  .stepper button:hover { background: var(--panel-h); }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper .val { display: inline-flex; align-items: center; justify-content: center; min-width: 66px; padding: 0 6px; height: 30px; gap: 3px; cursor: text; }
  .stepper input { width: 2ch; min-width: 1.6ch; border: none; background: transparent; color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 700; line-height: 1; text-align: right; padding: 0; outline: none; user-select: text; }
  .stepper input:focus { background: var(--panel); border-radius: 4px; box-shadow: 0 0 0 2px var(--accent); }
  .stepper .unit { font-weight: 700; }
  .stats { display: flex; gap: 6px; margin: 6px 0 8px; }
  .stat { flex: 1; text-align: center; background: var(--panel); border-radius: 8px; padding: 6px 2px; }
  .stat .n { font-size: 17px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--sub); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 64px; margin-top: 4px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .bar { width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .chart .col.today .bar { background: var(--accent); }
  .chart .num { font-size: 10px; color: var(--sub); }
  .chart .day { font-size: 10px; color: var(--sub); margin-top: 2px; }
  .caption { font-size: 11px; color: var(--sub); margin: 6px 0 0; text-align: center; }
  .btn { width: 100%; margin-top: 4px; padding: 9px; font: inherit; font-weight: 600; border: none; border-radius: 999px; background: var(--panel); color: var(--fg); cursor: pointer; }
  .btn:hover { background: var(--panel-h); }
  .btn.danger { background: var(--danger); color: #fff; }
  .confirm { margin-top: 4px; padding: 10px 12px; border-radius: 10px; background: var(--danger-bg); color: var(--fg); }
  .confirm p { margin: 0 0 8px; font-size: 13px; }
  .confirm .btns { display: flex; gap: 8px; }
  .confirm .btns .btn { margin: 0; white-space: nowrap; }
  [hidden] { display: none !important; }
  .msg { color: var(--ok); font-size: 12px; height: 18px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""><span data-i18n="popupTitle"></span></h1>
  <div class="status" id="status">-</div>

  <fieldset>
    <legend data-i18n="secLimit"></legend>
    <label class="row"><input type="radio" name="type" value="count"><span class="label" data-i18n="optCount"></span></label>
    <label class="row"><input type="radio" name="type" value="time"><span class="label" data-i18n="optTime"></span></label>
    <div class="row"><span class="label" id="amountLabel"></span><span class="stepper" data-key="amount"></span></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="secReset"></legend>
    <label class="row"><input type="radio" name="reset" value="open"><span class="label" data-i18n="optOpen"></span></label>
    <p class="hint" data-i18n="hintOpen"></p>
    <label class="row"><input type="radio" name="reset" value="daily"><span class="label" data-i18n="optDaily"></span></label>
    <p class="hint" data-i18n="hintDaily"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="secOpens"></legend>
    <label class="row"><input type="checkbox" id="opensOn"><span class="label" data-i18n="optOpensOn"></span></label>
    <div class="row" id="opensRow"><span class="label" data-i18n="labelOpens"></span><span class="stepper" data-key="maxOpens"></span></div>
    <p class="hint" data-i18n="hintOpens"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="secBadge"></legend>
    <label class="row"><input type="checkbox" id="badgeOn"><span class="label" data-i18n="optBadgeOn"></span></label>
    <div class="row" id="badgeRow"><span class="label" id="badgeLabel"></span><span class="stepper" data-key="badgeFrom"></span></div>
    <p class="hint" data-i18n="hintBadge"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="secDay"></legend>
    <div class="row"><span class="label" data-i18n="labelResetHour"></span><span class="stepper" data-key="resetHour"></span></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="secStats"></legend>
    <div class="stats">
      <div class="stat"><div class="n" id="stViews">0</div><div class="k" data-i18n="statViews"></div></div>
      <div class="stat"><div class="n" id="stWatch">0</div><div class="k" data-i18n="statWatch"></div></div>
      <div class="stat"><div class="n" id="stOpens">0</div><div class="k" data-i18n="statOpens"></div></div>
    </div>
    <div class="chart" id="chart"></div>
    <p class="caption" data-i18n="chartCaption"></p>
  </fieldset>

  <button id="resetNow" class="btn" data-i18n="btnReset"></button>
  <div class="confirm" id="confirm1" hidden>
    <p data-i18n="confirm1"></p>
    <div class="btns"><button class="btn" id="c1No" data-i18n="cancel"></button><button class="btn danger" id="c1Yes" data-i18n="confirm1Yes"></button></div>
  </div>
  <div class="confirm" id="confirm2" hidden>
    <p data-i18n="confirm2"></p>
    <div class="btns"><button class="btn" id="c2No" data-i18n="cancel"></button><button class="btn danger" id="c2Yes" data-i18n="confirm2Yes"></button></div>
  </div>
  <div class="msg" id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
