<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 16px; font: 14px/1.5 "Noto Sans JP", "Meiryo", sans-serif; color: #0f0f0f; background: #fff; user-select: none; }
  h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .status { margin: 0 0 14px; padding: 10px 12px; background: #f2f2f2; border-radius: 10px; }
  .status b { font-size: 17px; }
  fieldset { border: 1px solid #e5e5e5; border-radius: 10px; margin: 0 0 12px; padding: 6px 12px 10px; }
  legend { font-weight: 700; padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; min-height: 32px; cursor: pointer; }
  .row input[type=radio], .row input[type=checkbox] { margin: 0; width: 16px; height: 16px; cursor: pointer; }
  .row .label { flex: 1; white-space: nowrap; }
  .hint { font-size: 12px; color: #606060; margin: -4px 0 4px 24px; }
  .dim { opacity: 0.4; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid #d9d9d9; border-radius: 999px; overflow: hidden; }
  .stepper button { width: 32px; height: 30px; border: none; background: #f2f2f2; font: 600 18px/1 sans-serif; color: #0f0f0f; cursor: pointer; padding: 0; }
  .stepper button:hover { background: #e5e5e5; }
  .stepper button:disabled { color: #bbb; cursor: default; background: #f7f7f7; }
  .stepper .val { min-width: 54px; text-align: center; font-weight: 700; }
  .reset { width: 100%; margin-top: 4px; padding: 9px; font: inherit; font-weight: 600; border: none; border-radius: 999px; background: #f2f2f2; color: #0f0f0f; cursor: pointer; }
  .reset:hover { background: #e5e5e5; }
  .msg { color: #1a7f37; font-size: 12px; height: 18px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">ショート制限</h1>
  <div class="status" id="status">-</div>

  <fieldset>
    <legend>制限のしかた</legend>
    <label class="row"><input type="radio" name="type" value="count"><span class="label">スクロール回数</span></label>
    <label class="row"><input type="radio" name="type" value="time"><span class="label">視聴時間</span></label>
    <div class="row"><span class="label" id="amountLabel">上限</span><span class="stepper" data-key="amount"></span></div>
  </fieldset>

  <fieldset>
    <legend>リセットのタイミング</legend>
    <label class="row"><input type="radio" name="reset" value="open"><span class="label">ショートを開くたび</span></label>
    <p class="hint">ホームなどからショートを開き直すとリセット</p>
    <label class="row"><input type="radio" name="reset" value="daily"><span class="label">1日ごと</span></label>
    <p class="hint">1日の合計で数える（全タブ共通）</p>
  </fieldset>

  <fieldset>
    <legend>1日にショートを開ける回数</legend>
    <label class="row"><input type="checkbox" id="opensOn"><span class="label">回数を制限する</span></label>
    <div class="row" id="opensRow"><span class="label">1日に開ける回数</span><span class="stepper" data-key="maxOpens"></span></div>
    <p class="hint">ホームなどからショートに入るたびに1回</p>
  </fieldset>

  <fieldset>
    <legend>1日の区切り</legend>
    <div class="row"><span class="label">リセット時刻</span><span class="stepper" data-key="resetHour"></span></div>
  </fieldset>

  <button id="resetNow" class="reset">今すぐカウントをリセット</button>
  <div class="msg" id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
