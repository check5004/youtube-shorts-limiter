name: Release

# 使い方: Actions タブ →「Release」→「Run workflow」
# manifest.json の version を読み取り、v<version> のタグとリリースを作ってZIPを添付します。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIPを作ってリリース
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(jq -r .version manifest.json)"
          ZIP="shorts-limiter-$VER.zip"
          mkdir -p dist/shorts-limiter
          cp -r manifest.json content.js overlay.css popup.html popup.js icons LICENSE dist/shorts-limiter/
          (cd dist && zip -r "$ZIP" shorts-limiter)
          NOTES="Assets の $ZIP をダウンロードして展開し、chrome://extensions でデベロッパーモードをオンにして「パッケージ化されていない拡張機能を読み込む」から shorts-limiter フォルダを選んでください（Source code のZIPではありません）。詳しくは README を参照。"
          gh release create "$VER" "dist/$ZIP" --target "$GITHUB_SHA" --title "ショート制限 $VER" --notes "$NOTES"
